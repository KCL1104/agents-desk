name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Rust backend. Runs on 22.04 to match the release build.
  # ---------------------------------------------------------------------------
  rust:
    name: Rust
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            xdg-utils

      # The crate's default features include `custom-protocol`, which embeds the
      # frontend at compile time. Without ../ui/dist present, tauri-build fails
      # before a single test runs.
      - name: Build frontend
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Test
        working-directory: src-tauri
        # Tests that need the `claude` binary detect its absence and skip
        # themselves; the git-backed worktree tests set up their own repos.
        run: cargo test --locked

      # Advisory only. The tree is not rustfmt-clean today, and reformatting it is
      # a separate change from wiring up CI, so this reports drift without gating.
      - name: Lint (advisory)
        continue-on-error: true
        run: |
          cd src-tauri
          echo "::group::rustfmt"
          cargo fmt --all -- --check || echo "::warning::rustfmt reports drift"
          echo "::endgroup::"
          echo "::group::clippy"
          cargo clippy --all-targets --locked || echo "::warning::clippy reports lints"
          echo "::endgroup::"

  # ---------------------------------------------------------------------------
  # Frontend: typecheck, production build, and the Playwright suite.
  # ---------------------------------------------------------------------------
  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci

      # `tsc -b && vite build` — this is the typecheck and the build in one step.
      - name: Typecheck and build
        working-directory: ui
        run: npm run build

      - name: Install Playwright browser
        working-directory: ui
        run: npx playwright install --with-deps chromium

      # The suite drives the React app against a mocked Tauri bridge in Chromium,
      # so it needs no native shell and no display server.
      - name: End-to-end tests
        working-directory: ui
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Sidecar. Typecheck and bundle only — `npm run smoke` is deliberately excluded
  # because it drives a real Claude Code session and needs credentials.
  # ---------------------------------------------------------------------------
  sidecar:
    name: Sidecar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sidecar/package-lock.json

      - name: Install
        working-directory: sidecar
        run: npm ci

      - name: Typecheck
        working-directory: sidecar
        run: npm run typecheck

      - name: Build
        working-directory: sidecar
        run: npm run build

  # ---------------------------------------------------------------------------
  # Proves the release bundler still works on every OS, without cutting a release.
  # Only on demand and on main, since a full three-platform bundle is expensive.
  # ---------------------------------------------------------------------------
  bundle:
    name: Bundle (${{ matrix.name }})
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-22.04
          - name: macos-aarch64
            runner: macos-15
          - name: windows-x86_64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: bundle-${{ matrix.name }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            xdg-utils

      - name: Install Tauri CLI
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Bundle
        run: npm run tauri -- build
