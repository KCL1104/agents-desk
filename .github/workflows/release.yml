name: Release

# Builds AgentDesk installers for Linux, macOS (Apple Silicon + Intel) and Windows.
#
# The normal way to cut a release: Actions -> Release -> Run workflow -> pick a
# `bump` (patch / minor / major). The run computes the next version, writes it into
# tauri.conf.json / Cargo.toml / Cargo.lock / package.json, commits that to main,
# builds every platform from that commit and publishes the release. Nobody edits a
# version number by hand, so the number moves on every release by construction.
#
# All the ways it runs:
#   1. Dispatch with a `bump` -> the flow above. `patch` for fixes, `minor` for
#      features, `major` for breaking changes.
#   2. Dispatch with an explicit `tag` (e.g. v0.3.0) -> release exactly that tag.
#      The version files must already match — the guard refuses otherwise. This is
#      the recovery path: a release run that failed after its bump commit landed is
#      re-cut with the tag it already burned, not bumped a second time.
#   3. Push a tag like `v0.1.0` -> same as 2. Kept for people who prefer local git;
#      note some environments' credentials can push branches but not tags, which is
#      why the dispatch paths exist.
#   4. Push to main -> builds every platform into the rolling `nightly` prerelease,
#      replacing whatever was there before. This is how the binaries CI produces stay
#      downloadable instead of being thrown away at the end of the run.
#   5. Dispatch with no bump and no tag -> builds every platform and attaches the
#      installers as workflow artifacts. No release is created or touched.
#
# In modes 1-2 no tag is ever pushed over git: GitHub creates it at the built commit
# when the release publishes, the same mechanism the nightly's tag has always used.
# Every run also attaches the installers to the run itself, so a build is
# downloadable even when no release was involved.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Cut a release by bumping the version: patch = fixes, minor = features, major = breaking. Writes the new version into the repo itself."
        required: false
        type: choice
        options: ["none", "patch", "minor", "major"]
        default: "none"
      tag:
        description: "Or release an exact existing version (e.g. v0.1.0); must match tauri.conf.json. Leave both empty to only build."
        required: false
        type: string
        default: ""

# Needed so the workflow can create the GitHub Release and upload assets to it.
permissions:
  contents: write

concurrency:
  # The event name is part of the group so a routine push to main can never
  # cancel a manually dispatched release build running on the same branch.
  group: release-${{ github.ref }}-${{ github.event_name }}
  # Superseding only makes sense for the rolling build: when several commits land
  # on main at once, only the newest one's binaries are wanted, and the run that
  # takes over recreates the nightly release from scratch anyway. A tag build or
  # a dispatched release must never be cancelled — its artifacts are the release.
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

jobs:
  # ---------------------------------------------------------------------------
  # Creates the draft release the build matrix uploads into, so the four platform
  # jobs never race to create it themselves. Skipped on a manual dispatch with no
  # tag, where the point is a build without touching any release.
  # ---------------------------------------------------------------------------
  create-release:
    if: ${{ github.event_name == 'push' || inputs.tag != '' || (inputs.bump != '' && inputs.bump != 'none') }}
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      tag: ${{ steps.create.outputs.tag }}
      nightly: ${{ steps.create.outputs.nightly }}
      # The commit the platform jobs must build: the bump commit when one was
      # made, otherwise empty and the build falls back to the triggering sha.
      build_sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      # Two different answers to "which version?" cannot both win.
      - name: Refuse ambiguous inputs
        if: ${{ inputs.tag != '' && inputs.bump != '' && inputs.bump != 'none' }}
        run: |
          echo "::error::Set either 'bump' or 'tag', not both."
          exit 1

      # The whole point of the bump path: the version number is maintained by the
      # release itself, not by anyone's memory. Computes the next version, writes
      # it into every file that carries one, and commits that to main so the repo
      # and the release can never drift apart. Cargo.lock is edited too — CI runs
      # `cargo test --locked`, which a stale lock entry would fail.
      #
      # The push uses the run's own GITHUB_TOKEN, and pushes made with that token
      # do not trigger new workflow runs — so this cannot recurse into another
      # nightly build.
      - name: Bump the version
        id: bump
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bump != '' && inputs.bump != 'none' && inputs.tag == '' }}
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          current="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          IFS=. read -r MA MI PA <<<"$current"
          case "$BUMP" in
            major) MA=$((MA + 1)); MI=0; PA=0 ;;
            minor) MI=$((MI + 1)); PA=0 ;;
            patch) PA=$((PA + 1)) ;;
            *) echo "::error::Unknown bump '$BUMP'"; exit 1 ;;
          esac
          next="${MA}.${MI}.${PA}"
          echo "bumping ${current} -> ${next}"

          # Surgical regex edits rather than JSON re-serialisation, so the only
          # line that changes in the diff is the version itself.
          python3 - "$next" <<'PY'
          import re, sys
          next_v = sys.argv[1]
          def sub(path, pattern, repl):
              s = open(path).read()
              s, n = re.subn(pattern, repl, s, count=1)
              assert n == 1, f"version not found in {path}"
              open(path, 'w').write(s)
          sub('src-tauri/tauri.conf.json', r'("version":\s*")[^"]+(")', rf'\g<1>{next_v}\g<2>')
          sub('package.json',              r'("version":\s*")[^"]+(")', rf'\g<1>{next_v}\g<2>')
          sub('src-tauri/Cargo.toml',      r'(?m)^version = "[^"]+"', f'version = "{next_v}"')
          sub('src-tauri/Cargo.lock',
              r'(\[\[package\]\]\nname = "agentdesk"\nversion = ")[^"]+(")',
              rf'\g<1>{next_v}\g<2>')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock package.json
          git commit -m "Release v${next}"
          git push origin HEAD:main
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The bundler names every artifact after the version in tauri.conf.json, not
      # after the git tag. Without this guard, tagging v0.2.0 while the config still
      # says 0.1.0 silently ships files called AgentDesk_0.1.0_*.
      #
      # Applies to both versioned paths — pushed tag and dispatched tag. A nightly
      # is whatever main currently says it is, so there is nothing for it to
      # disagree with.
      - name: Check the tag matches tauri.conf.json
        if: ${{ github.ref_type == 'tag' || inputs.tag != '' }}
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *)
              echo "::error::'${TAG}' does not look like a release tag (vX.Y.Z)."
              exit 1
              ;;
          esac
          tag_version="${TAG#v}"
          config_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "tag=${tag_version}  tauri.conf.json=${config_version}"
          if [ "$tag_version" != "$config_version" ]; then
            echo "::error::Tag ${TAG} does not match version ${config_version} in src-tauri/tauri.conf.json."
            echo "::error::Bump the version in src-tauri/tauri.conf.json (and Cargo.toml / package.json) or retag."
            exit 1
          fi

      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_TAG: ${{ inputs.tag }}
          BUMP_TAG: ${{ steps.bump.outputs.tag }}
          # The commit the release points at and the platform jobs build: the
          # bump commit when one was made, otherwise whatever triggered the run.
          BUILD_SHA: ${{ steps.bump.outputs.sha || github.sha }}
        run: |
          set -euo pipefail

          # Which release is this? None of the dispatch tags exist in git yet, and
          # never need to — GitHub creates the tag at BUILD_SHA when the draft is
          # published, exactly the mechanism the nightly already relies on. No git
          # push of a tag happens anywhere.
          if [ -n "${DISPATCH_TAG}" ]; then
            tag="$DISPATCH_TAG"
          elif [ -n "${BUMP_TAG}" ]; then
            tag="$BUMP_TAG"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="nightly"
          fi

          if [ "$tag" != "nightly" ]; then
            echo "nightly=false" >> "$GITHUB_OUTPUT"
            # Re-running should reuse the release rather than fail. --target is
            # ignored when the tag already exists (the pushed-tag case) and pins
            # the dispatched cases to the commit this run actually builds.
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" \
                --draft \
                --target "$BUILD_SHA" \
                --title "AgentDesk $tag" \
                --generate-notes
            fi
          else
            echo "nightly=true" >> "$GITHUB_OUTPUT"
            version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
            # A rolling release has to be replaced, not appended to, or it would
            # accumulate one set of installers per commit under the same tag.
            # Deleting the tag with it keeps `nightly` pointing at the commit the
            # binaries were actually built from.
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true

            # Written to a file rather than passed inline: a quoted multi-line
            # string inside this block would carry the YAML indentation into the
            # release notes.
            cat > /tmp/nightly-notes.md <<NOTES
          Unstable build from \`main\` at ${GITHUB_SHA}, replaced on every push.

          Unsigned, the same as the tagged releases — see the README for how to open
          it on macOS and Windows.

          For something stable, use the newest versioned release:
          ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/latest
          NOTES

            gh release create "$tag" \
              --draft \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "AgentDesk nightly (${version}, ${GITHUB_SHA:0:7})" \
              --notes-file /tmp/nightly-notes.md
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "release_id=$(gh release view "$tag" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # The actual cross-platform build.
  # ---------------------------------------------------------------------------
  build:
    needs: create-release
    # `needs` alone would skip this job on workflow_dispatch, because create-release
    # is skipped there. `always()` keeps it running, and we only bail if the release
    # job genuinely failed.
    if: ${{ always() && needs.create-release.result != 'failure' && needs.create-release.result != 'cancelled' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on 22.04 on purpose: glibc/WebKit are forward-compatible only, so
          # a 24.04 build would refuse to run on 22.04 machines.
          - name: linux-x86_64
            runner: ubuntu-22.04
            args: ""
            rust_targets: ""
          - name: macos-aarch64
            runner: macos-15
            args: "--target aarch64-apple-darwin"
            rust_targets: "aarch64-apple-darwin"
          - name: macos-x86_64
            runner: macos-15-intel
            args: "--target x86_64-apple-darwin"
            rust_targets: "x86_64-apple-darwin"
          - name: windows-x86_64
            runner: windows-latest
            args: ""
            rust_targets: ""

    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        # Windows runners default to pwsh; force bash so one script works everywhere.
        shell: bash

    steps:
      # A bump run must build the bump commit, not the commit the dispatch froze
      # at — github.sha predates the version change. Empty (no bump) falls back
      # to the triggering commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release.outputs.build_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      # libwebkit2gtk-4.1 is the engine Tauri v2 renders with. xdg-utils is required
      # by the AppImage bundler (it shells out to xdg-mime/xdg-open), and patchelf +
      # librsvg2 are what actually assemble the AppImage.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            xdg-utils

      # Provides the Tauri CLI that tauri-action drives via `npm run tauri`.
      - name: Install Tauri CLI
        run: npm ci

      # tauri.conf.json's beforeBuildCommand runs `npm --prefix ../ui run build`,
      # so the UI's node_modules must exist before the bundler starts. The bundler
      # builds the frontend itself; don't build it here or it happens twice.
      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No signing env here on purpose. The bundler treats APPLE_CERTIFICATE as
          # "sign this" whenever the variable EXISTS, empty value included — it does
          # not test for a non-empty one. Wiring the secrets in unconditionally
          # therefore broke both macOS jobs on a repo that has none of them:
          #   security: SecKeychainItemImport: One or more parameters ... not valid
          #   failed to bundle project: failed codesign application
          # Omitting them is what produces a working unsigned build.
          #
          # To sign, add the secrets to the repository and put them back here:
          #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
          # Add them only once they hold real values, for the reason above.
        with:
          # Empty when dispatched without a tag, which makes the action build
          # without touching any release.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
          # This project has no tauri-plugin-updater, so there is nothing to sign
          # an update manifest for.
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          # Always keep a downloadable copy on the run itself, which is the only
          # output when the workflow is dispatched manually.
          uploadWorkflowArtifacts: true
          # The action uploads once PER BUNDLE, naming each from this pattern, so a
          # constant name collides the moment a platform produces more than one:
          # Linux alone emits deb + rpm + AppImage, and the second upload came back
          # "(409) Conflict: an artifact with this name already exists".
          # [platform]-[arch]-[bundle] is unique both within a job and across the
          # matrix — it is the action's own default, kept here with a prefix.
          workflowArtifactNamePattern: agentdesk-[platform]-[arch]-[bundle]
          retryAttempts: 2

  # ---------------------------------------------------------------------------
  # Flip the draft release to published, but only once every platform succeeded.
  # A partial failure leaves the release in draft so nothing half-built ships —
  # which for a nightly also means the previous good one stays the visible copy.
  # ---------------------------------------------------------------------------
  publish-release:
    needs: [create-release, build]
    # create-release succeeding covers every mode that owns a release — pushed
    # tag, dispatched tag, nightly — and is skipped on a build-only dispatch.
    if: ${{ always() && needs.create-release.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
          NIGHTLY: ${{ needs.create-release.outputs.nightly }}
        run: |
          set -euo pipefail
          if [ "$NIGHTLY" = "true" ]; then
            # Never --latest: a rolling build must not displace the newest real
            # version on the repo's front page or in the "latest release" API.
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi

  # ---------------------------------------------------------------------------
  # A failed nightly would otherwise leave an invisible draft behind, and the
  # next push would delete it anyway — but a draft with a moved tag is confusing
  # in the meantime, so clean it up.
  # ---------------------------------------------------------------------------
  discard-failed-nightly:
    needs: [create-release, build]
    if: ${{ always() && needs.create-release.outputs.nightly == 'true' && needs.build.result != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Remove the unfinished nightly draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete nightly --yes --cleanup-tag || true
